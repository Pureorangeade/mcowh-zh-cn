<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉化译文编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20304a;background:#f3f6fb;font:14px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #cbd5e1;border-radius:7px;padding:8px 14px;color:#243653}button:hover{background:#eef3ff}button.primary{background:#2858ce;border-color:#2858ce;color:white}button:disabled{opacity:.4;cursor:default}header{padding:18px 24px;background:#fff;border-bottom:1px solid #dbe2ed;display:flex;align-items:center;gap:20px}h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:#627189;font-size:12px}.actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}.bar{display:flex;gap:10px;padding:12px 24px;align-items:center}input,select{border:1px solid #cbd5e1;border-radius:7px;padding:9px 11px;background:#fff;color:#20304a}#search{flex:1;min-width:150px}#count{color:#61718a;white-space:nowrap}.workspace{height:calc(100vh - 173px);min-height:530px;display:grid;grid-template-columns:300px 1fr;gap:14px;padding:0 24px 20px}.sidebar,.content{background:#fff;border:1px solid #dbe2ed;border-radius:10px;overflow:hidden}.sidebar{display:flex;flex-direction:column}#list{flex:1;overflow:auto}.item{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #edf0f5;border-radius:0;padding:12px 14px}.item.selected{background:#e8efff;box-shadow:inset 3px 0 #2858ce}.item strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:#75829a;display:block;margin-top:4px}.pager{padding:9px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #dde4ef}.pager button{padding:4px 10px}.content{display:flex;flex-direction:column;min-width:0}.heading{padding:14px 18px;border-bottom:1px solid #e0e6f0;display:flex;justify-content:space-between;gap:10px}.heading b{font-size:15px}.badge{color:#62718a;font-size:12px}.panes{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;min-height:250px}.pane{padding:14px 18px;display:flex;flex-direction:column;min-width:0}.pane+.pane{border-left:1px solid #e0e6f0}.pane label{display:flex;align-items:center;justify-content:space-between;color:#576b87;margin-bottom:10px;font-size:12px}.pane label span{color:#91a0b5}textarea{resize:none;flex:1;width:100%;border:1px solid #d8e0ee;border-radius:7px;padding:14px;line-height:1.85;font-size:15px;background:#fff;color:#1b2d49;min-height:200px;tab-size:2}textarea:focus{outline:2px solid #8caef3;border-color:transparent}textarea[readonly]{background:#f6f8fc;color:#425574}.preview{display:none;white-space:pre-wrap;overflow:auto;flex:1;padding:14px;line-height:1.85;border:1px solid #d8e0ee;border-radius:7px}#validation{min-height:35px;padding:4px 18px;color:#16815c;font-size:12px}#validation.error{color:#b32d35}.footer{padding:12px 18px;border-top:1px solid #e0e6f0;display:flex;align-items:center;gap:8px}.footer small{margin-left:auto;color:#7b899f}.details{padding:0 18px 12px;color:#687b97;font-size:12px;max-height:120px;overflow:auto}.details pre{white-space:pre-wrap;word-break:break-all}#message{font-size:12px;margin:0 24px 7px;min-height:18px;color:#526b92}#importFile{display:none}@media(max-width:1050px){header{align-items:flex-start}.workspace{grid-template-columns:240px 1fr;padding:0 12px 12px}.panes{grid-template-columns:1fr;overflow:auto}.pane{min-height:280px}.pane+.pane{border-left:0;border-top:1px solid #e0e6f0}.actions button{padding:7px 9px}.bar{padding:10px 12px}}
#japaneseOrigin{font-size:11px;color:#9b650a;margin-bottom:7px}#japaneseHint{white-space:pre-wrap;overflow:auto;max-height:115px;color:#71809a;font-size:11px;margin-bottom:0}.review input{width:100%;margin-bottom:8px}.review{flex-shrink:0;max-height:180px}.pane textarea{min-height:140px}.footer{flex-wrap:wrap}.footer small{font-size:11px}</style></head><body>
<header><div><h1>汉化译文编辑器</h1><p>英日中对照 · 本地使用 · 修改保存在浏览器草稿中，不会直接改动游戏</p></div><div class="actions"><button id="import">导入修订</button><button class="primary" id="export">导出修订 JSON</button></div></header>
<div class="bar"><input id="search" placeholder="搜索英文、日文、中文或编号…" aria-label="搜索译文"><select id="category" aria-label="内容分类"><option value="">全部分类</option></select><select id="filter" aria-label="条目筛选"><option value="all">全部条目</option><option value="edited">我的修改</option><option value="llm">本聊天模型已重译</option><option value="review">尚未重译的旧稿</option><option value="pending">待你判断</option><option value="deferred">暂缓，最后终审</option><option value="locked">保留英文缩写</option></select><span id="count"></span></div>
<div id="message" role="status">导出修订后发给我，即可合入下一版；也可用项目内的导入工具自行合并。</div>
<div class="workspace"><aside class="sidebar"><div id="list"></div><div class="pager"><button id="prevPage">上一页</button><span id="page"></span><button id="nextPage">下一页</button></div></aside>
<main class="content"><div class="heading"><b id="section">选择一条译文</b><span id="state" class="badge"></span></div><div class="panes"><section class="pane"><label>英文原文（只读）<span id="sourceLength"></span></label><textarea id="source" readonly spellcheck="false"></textarea><div class="preview" id="sourcePreview"></div></section><section class="pane"><label>日文原文（只读）</label><small id="japaneseOrigin"></small><textarea id="japanese" readonly spellcheck="false"></textarea><div class="preview" id="japanesePreview"></div><pre id="japaneseHint"></pre></section><section class="pane"><label>中文译文<span id="targetLength"></span></label><textarea id="target" spellcheck="false" placeholder="在此编辑中文译文…"></textarea><div class="preview" id="targetPreview"></div></section></div><div id="validation" role="status"></div><details class="details review"><summary>语境不确定？暂缓至最后终审</summary><p id="reviewNote"></p><input id="reviewReason" maxlength="2000" placeholder="可填写疑点或需要查证的语境" aria-label="暂缓原因"><button id="defer">整条暂缓，保留原文</button><button id="resume">取消整条暂缓</button><p>中文草稿保留在右栏。导出并合入后，整条暂缓的文本将使用英文原文；术语级暂缓只保留该术语。</p></details><details class="details"><summary>查看定位与需保留的控制标记</summary><pre id="location"></pre><pre id="controlTokens"></pre></details><div class="footer"><button id="previous">上一条</button><button id="next">下一条</button><button id="reset">撤销本条修改</button><button id="preview">阅读预览</button><small>自动存草稿 · Ctrl+S 保存 · Ctrl+Enter 下一条</small></div></main></div>
<input type="file" id="importFile" accept=".json,application/json">
<script id="catalogue" type="application/json">__DATA__</script><script>__CORE__</script><script>__APP__</script></body></html>
